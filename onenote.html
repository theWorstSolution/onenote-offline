<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Offline Note Board</title>
<style>
  body {
  margin: 0;
  background: #1e1e1e;
  font-family: sans-serif;
  overflow: auto;
  width: 5000px;
  height: 5000px;
}

  .note {
    position: absolute;
    width: 250px;
    height: 180px;
    background: #2d2d2d;
    color: white;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    overflow: hidden;
    resize: both;
    min-width: 180px;
    min-height: 120px;
  }

  .header {
    height: 36px;
    background: #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    cursor: move;
    user-select: none;
    font-size: 14px;
  }

  .close {
    cursor: pointer;
    font-weight: bold;
  }

  .close:hover {
    color: #ff6666;
  }

  .content {
    padding: 10px;
    height: calc(100% - 56px);
    outline: none;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>

<script>
let notes = JSON.parse(localStorage.getItem("notes") || "[]");

function saveNotes() {
  const allNotes = document.querySelectorAll(".note");
  notes = Array.from(allNotes).map(note => ({
    x: parseInt(note.style.left),
    y: parseInt(note.style.top),
    width: note.offsetWidth,
    height: note.offsetHeight,
    content: note.querySelector(".content").innerText
  }));
  localStorage.setItem("notes", JSON.stringify(notes));
}

function createNote(x, y, content = "", width = 250, height = 180) {
  const note = document.createElement("div");
  note.className = "note";
  note.style.left = x + "px";
  note.style.top = y + "px";
  note.style.width = width + "px";
  note.style.height = height + "px";

  const header = document.createElement("div");
  header.className = "header";

  const title = document.createElement("span");
  title.textContent = "☰ Drag";

  const closeBtn = document.createElement("span");
  closeBtn.className = "close";
  closeBtn.textContent = "✕";

  closeBtn.addEventListener("click", () => {
    note.remove();
    saveNotes();
  });

  header.appendChild(title);
  header.appendChild(closeBtn);

  const contentDiv = document.createElement("div");
  contentDiv.className = "content";
  contentDiv.contentEditable = true;
  contentDiv.spellcheck = false;
  contentDiv.innerText = content;

  contentDiv.addEventListener("input", saveNotes);

  note.appendChild(header);
  note.appendChild(contentDiv);
  document.body.appendChild(note);

  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  header.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - note.offsetLeft;
    offsetY = e.clientY - note.offsetTop;
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    note.style.left = (e.clientX - offsetX) + "px";
    note.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", () => {
    if (isDragging) {
      isDragging = false;
      saveNotes();
    }
  });

  const resizeObserver = new ResizeObserver(() => {
    saveNotes();
  });
  resizeObserver.observe(note);
}

notes.forEach(n =>
  createNote(
    n.x,
    n.y,
    n.content,
    n.width || 250,
    n.height || 180
  )
);

document.addEventListener("dblclick", (e) => {
  if (!e.target.closest(".note")) {
    createNote(e.pageX, e.pageY);
    saveNotes();
  }
});
</script>

</body>
</html>
